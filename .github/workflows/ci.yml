name: Eyen CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node --check src/server.js

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APKs (CI and pull requests)
        run: gradle --no-daemon :parent:assembleDebug :child:assembleDebug
        working-directory: android
      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: eyen-debug-apks
          path: |
            android/parent/build/outputs/apk/debug/parent-debug.apk
            android/child/build/outputs/apk/debug/child-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Prepare Android signing key
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" > /tmp/eyen-keystore-base64.txt
          sed '/-----BEGIN CERTIFICATE-----/d; /-----END CERTIFICATE-----/d' /tmp/eyen-keystore-base64.txt | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/eyen-release.jks"
          test -s "$RUNNER_TEMP/eyen-release.jks"
      - name: Build signed release APKs
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/eyen-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :parent:assembleRelease :child:assembleRelease
        working-directory: android
      - name: Upload signed release APKs
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: eyen-signed-release-apks
          path: |
            android/parent/build/outputs/apk/release/parent-release.apk
            android/child/build/outputs/apk/release/child-release.apk
          if-no-files-found: error
          retention-days: 30
